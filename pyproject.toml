[project]
name = "pyomo-learning"
version = "0.1.0"
description = "Pyomo optimisation learning project"
authors = [
    {name = "Navesh Kumar"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    # Core scientific computing
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.11,<1.17",          # 1.11–1.16 support Python 3.10

    # Pyomo optimisation framework
    "pyomo>=6.7,<7.0",

    # Solvers
    "highspy>=1.7,<2.0",          # HiGHS LP/MIP/QP solver

    # Plotting & visualisation
    "matplotlib>=3.7,<4.0",
    "seaborn>=0.13,<1.0",

    # Utilities
    "openpyxl>=3.1,<4.0",         # Excel read/write for pandas
    "jupyterlab>=4.0,<5.0",       # Interactive notebooks
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.dev.dependencies]
# Development tools (not installed in production)
ipykernel = ">=6.0"              # Jupyter kernel for notebooks
